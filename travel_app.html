function locationStory(id){const titles={city:'Город в своём ритме',medeu:'Выше городского шума',shymbulak:'Панорамы гор',gorelnik:'Тропа среди елей'};return `<section class="location-story"><p class="story-kicker">${icon(places[id].category==='city'?'city':'leaf')}Идея для ${places[id].category==='city'?'прогулки':'выезда'}</p><h2>${places[id].story||titles[id]}</h2><p class="muted">${places[id].about}</p></section>`;}
function routeSteps(id){const routes={city:[['Начало прогулки','Памятник Виктору Цою'],['Пешком по Тулебайке','Тулебаева / Кабанбай батыра']],medeu:[['Автобус №12','До остановки «Медеу»'],['Пешком','К катку и началу горных троп']],shymbulak:[['Автобус №12','До Медеу'],['Канатная дорога','Далее до Шымбулака']],gorelnik:[['Автобус №12','До Медеу'],['Экопост','Начало пешего участка'],['Пешком к Горельнику','Учитывай погоду и подготовку']]};return `<section class="location-directions"><h2>Твой путь</h2><ol class="arrival-steps">${(places[id].steps||routes[id]).map(([title,body],i)=>`<li><span class="arrival-number" aria-hidden="true">${i+1}</span><span><strong>${title}</strong><span class="caption muted">${body}</span></span></li>`).join('')}</ol><p class="caption muted">Перед поездкой проверь расписание и погодные условия.</p></section>`;}
function tabPanel(id,tab){if(tab==='info')return locationStory(id)+(photoCredits[id]?`<p class="photo-credit">Фото: <a href="${photoCredits[id].url}" target="_blank" rel="noopener">${photoCredits[id].author}</a> · <a href="${photoCredits[id].licenseUrl}" target="_blank" rel="noopener">${photoCredits[id].license}</a>. Размер уменьшен, кадрирование при показе.</p>`:'');if(tab==='directions')return routeSteps(id);return `${audio(id)}<p class="caption muted audio-note">Макет аудиогида. Запись пока не подключена. Айссултан — персонаж концепции.</p>`;}

function placePreview(id){return `<div class="flow-place"><span class="flow-place-mark" aria-hidden="true">${icon('pin')}</span><span><small>ДОБАВЛЯЕМ В ПОЕЗДКУ</small><strong>${places[id].title}</strong><span class="caption muted">${places[id].sub}</span></span></div>`;}
function flowScreen(content,footer){return `<section class="flow-screen"><div class="viewport flow-content"><div class="page flow-page">${content}</div></div><footer class="flow-footer" aria-label="Действия">${footer}</footer></section>`;}
function tripForm(pending='',edit=false){const t=edit?state.trip:null,hasPlace=Boolean(places[pending]);return flowScreen(`${backButton()}<div class="flow-intro"><p class="flow-eyebrow">${edit?'ТВОЯ ПОЕЗДКА':'НАЧАЛО ПУТЕШЕСТВИЯ'}</p><h1 class="pine">${edit?'Настроим поездку':hasPlace?'Сначала — даты':'Соберём твой Алматы'}</h1><p class="muted">${edit?'Обнови название и даты. Места останутся в своих днях.':hasPlace?'Создай поездку, чтобы выбрать день для этого места.':'Выбери даты — любимые места соберём по дням.'}</p></div>${hasPlace?placePreview(pending):''}<form id="trip-form" class="stack flow-form" data-pending="${esc(pending)}" data-edit="${edit}"><label class="form-field"><span>Название поездки</span><input name="name" required maxlength="60" value="${esc(t?.name||'Мой Алматы')}" autocomplete="off"></label><div class="form-dates"><label class="form-field"><span>Первый день</span><input name="start" type="date" required value="${t?.start||'2026-10-24'}" aria-describedby="date-error"></label><label class="form-field"><span>Последний день</span><input name="end" type="date" required value="${t?.end||'2026-10-26'}" aria-describedby="date-error"></label></div><p class="field-error" id="date-error" role="alert"></p><p class="caption muted">От 1 до 14 дней. Название и даты можно изменить позже.</p></form>`,`<button class="btn" type="submit" form="trip-form">${edit?'Сохранить изменения':hasPlace?'Создать и выбрать день':'Создать поездку'}</button>`);}
function picker(id){if(!places[id])return missing();if(!state.trip)return tripForm(id);if(!state.trip.days.some(d=>d.date===selectedDate))selectedDate=state.trip.start;const dateLabel=date=>new Date(date+'T12:00:00Z').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});return flowScreen(`<header class="flow-heading">${backButton()}<h1 class="pine">В какой день?</h1></header>${placePreview(id)}<div class="flow-trip"><strong>${esc(state.trip.name)}</strong><span class="caption muted">${formatDate(state.trip.start)} — ${formatDate(state.trip.end)}</span></div><div class="day-choices" role="group" aria-label="Выбери день">${state.trip.days.map(d=>{const added=d.stops.some(s=>s.id===id),count=d.stops.length;return `<button class="day-choice" data-day="${d.date}" aria-pressed="${d.date===selectedDate}"><span class="day-number" aria-hidden="true">${Number(d.date.slice(-2))}</span><span class="day-choice-copy"><strong>${dateLabel(d.date)}</strong><span>${added?'Это место уже в плане':count?'Мест в плане: '+count:'Пока свободно'}</span></span><span class="day-check" aria-hidden="true">✓</span></button>`}).join('')}</div>`,`<p id="add-hint" class="flow-feedback" role="status"></p><button class="flow-secondary" data-go="trip/${selectedDate}">Посмотреть поездку</button><button id="confirm-place" class="btn" data-action="confirm-add" data-place="${id}" ${state.trip.days.find(d=>d.date===selectedDate).stops.some(s=>s.id===id)?'disabled':''}>${state.trip.days.find(d=>d.date===selectedDate).stops.some(s=>s.id===id)?'Уже в этом дне':'Добавить '+formatDate(selectedDate)}</button>`);}

function search(){return view(`${backButton()}<h1 class="pine">Найди свой Алматы</h1><label class="form-field"><span>Название места</span><span class="search-field">${icon('search')}<input id="search-input" type="search" placeholder="Например, Медеу" value="${esc(query)}" autocomplete="off"></span></label><p id="result-count" class="caption muted" role="status" aria-live="polite"></p><div class="stack" id="results">${results()}</div>`)}
function results(){const found=Object.keys(places).filter(k=>(places[k].title+' '+places[k].sub).toLowerCase().includes(query.trim().toLowerCase()));return found.length?found.map(k=>`<button class="tile" data-go="place/${k}/info">${icon('pin')}<span class="grow"><span class="card-title">${places[k].title}</span><span class="caption muted">${places[k].meta}</span></span></button>`).join(''):`<div class="empty"><h3>Пока ничего не нашли</h3><p class="muted">Попробуй «Медеу» или «Золотой квадрат».</p><button class="btn secondary" data-action="clear-search">Сбросить поиск</button></div>`}
function map(id='medeu'){if(!places[id])id='medeu';const city=places[id].category==='city';return `<section class="map-screen" aria-label="Схема местности"><h1 class="sr-only">Карта Алматы</h1><div class="map-art" aria-hidden="true"><img src="${id==='kaindy'?ASSETS.regionMap:city?ASSETS.cityMap:ASSETS.map}" alt=""></div><div class="map-controls"><button class="map-search" data-go="search">${icon('search')}Найти место на карте</button>${city?'':`<button class="sos" data-go="sos">${icon('compass')}SOS · помощь в горах</button>`}</div><p class="map-credit">Схема · не для навигации</p><section class="route-sheet ${collapsed?'collapsed':''}" aria-label="Выбранное место"><button class="handle" data-action="sheet" aria-expanded="${!collapsed}" aria-label="${collapsed?'Развернуть':'Свернуть'} описание"><span></span><span class="sr-only">Описание места</span></button><div class="sheet-content" ${collapsed?'inert aria-hidden="true"':''}><p class="caption pine">ВЫБРАННОЕ МЕСТО</p><h2>${places[id].title}</h2><p class="muted">${places[id].arrival}</p>${button('Подробнее о месте','place/'+id+'/info',true)}${button('Добавить в день','add/'+id)}</div></section></section>${nav('map')}`}
const audioTitles={medeu:'Медеу: выше городского шума',shymbulak:'Шымбулак: ближе к вершинам',city:'Прогулка по Тулебайке',gorelnik:'Горельник: тропа среди елей',arbat:'Арбат: музыка городских улиц',koktobe:'Кок-Тобе: город на ладони',butakovsky:'Бутаковский: навстречу водопаду',kaindy:'Каинды: истории затопленного леса'};
function audio(id='city'){return `<section class="audio ${playing?'playing':''}" aria-label="Демонстрационный плеер"><div class="row audio-author"><img class="guide-photo" src="${ASSETS.photos.guide}" alt="Портрет персонажа аудиогида" width="64" height="64"><div class="guide-credit"><p class="label">Айссултан, режиссёр</p><p class="caption">Голос твоего Алматы</p></div></div><h3>${audioTitles[id]||places[id].title}</h3><div class="wave" aria-hidden="true">${Array.from({length:39},(_,i)=>`<i style="height:${6+(i*17+11)%27}px;--i:${i}"></i>`).join('')}</div><button class="btn secondary audio-toggle" data-action="play" aria-pressed="${playing}">${icon(playing?'pause':'play')}<span>${playing?'Пауза':'Слушать'}</span></button></section>`}
function sos(){return view(`${backButton()}<h1 class="pine">Помощь в горах</h1><div class="tint sand"><p class="receipt">112</p><h3>Единая экстренная служба</h3><p>Расскажи, что произошло, где ты находишься и сколько человек нуждаются в помощи.</p><p class="caption">Демо: звонок не выполняется.</p></div><h2 class="pine">Компас и координаты недоступны</h2><p class="muted">В макете нет доступа к датчикам. Назови спасателям ближайшие ориентиры.</p>`)}
function ai(){return view(`${backButton()}<h1 class="pine">Какой будет<br>твой день?</h1><p class="muted">Подберём основу прогулки по Тулебайке. Места и порядок можно изменить.</p><div class="city-chip">В город · пешком и без спешки</div><div class="tempo" role="group" aria-label="Темп прогулки">${[['calm','Не спеша'],['active','Активно']].map(([k,t])=>`<button data-pace="${k}" aria-pressed="${state.pace===k}">${t}</button>`).join('')}</div><div class="notice"><h3>Почему эта прогулка?</h3><p>Городские аллеи и локальные истории собраны вокруг одной локации. Можно обойтись без машины.</p></div>${button('Предложить день','plan')}<p class="caption muted">Демонстрационный подбор, без подключённого AI.</p>`)}
function plan(){return view(`${backButton()}<h1 class="pine">Твой Алматы.<br>${state.pace==='active'?'Больше открытий.':'Без спешки.'}</h1><p class="muted">Тулебайка, архитектура и остановка на кофе. ${state.pace==='active'?'Активная прогулка.':'В своём темпе.'}</p><div class="notice"><h3>Золотой квадрат</h3><p>${places.city.about}</p></div>${button('Выбрать день поездки','add/city')}${button('Изменить предпочтения','ai',true)}`)}
function missing(){return view(`${backButton()}<h1 class="pine">Здесь ещё нет маршрута</h1>${button('На главную','home')}`)}
function render({restore=true}={}){const r=(location.hash.slice(1)||'home').split('/'),key=r[0];playing=false;lastHash=location.hash;device.classList.toggle('with-nav',['home','favorites','trip'].includes(key));device.classList.toggle('map-mode',key==='map');const views={home,favorites,search,sos,ai,plan,create:()=>tripForm(r[1]),edit:()=>state.trip?tripForm('',true):tripForm(),trip:()=>trip(r[1]),place:()=>detail(r[1],['info','directions','audio'].includes(r[2])?r[2]:'info'),add:()=>picker(r[1]),map:()=>map(r[1])};app.innerHTML=(views[key]||missing)();const v=$('.viewport');if(v&&restore)v.scrollTop=scrolls.get(location.hash)||0;const h=$('#app h1');if(h&&restore){h.tabIndex=-1;h.focus({preventScroll:true})}document.title=(key==='place'?places[r[1]]?.title:({home:'Твой Алматы',trip:'Поездка',favorites:'Избранное',search:'Поиск',map:'Карта',create:'Новая поездка',add:'Выбор дня',edit:'Изменить поездку'})[key]||'В своём ритме')+' · В путь';if(key==='search')announceResults();}
function toast(message,undo=false){const t=$('#toast');clearTimeout(toastTimer);t.textContent=message;if(undo)t.insertAdjacentHTML('beforeend',' <button class="undo" data-action="undo">Отменить</button>');t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,undo?8000:3500)}
function updateFavorite(id){const on=!state.favorites.includes(id);state.favorites=on?[...state.favorites,id]:state.favorites.filter(k=>k!==id);persist();document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>{b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',(on?'Убрать из избранного':'Добавить в избранное')+': '+places[id].title);b.innerHTML=icon(on?'heartsaved':'heart')});$('#live').textContent=places[id].title+(on?' добавлено в избранное':' удалено из избранного');if(location.hash==='#favorites'&&!on){$(`[data-card="${id}"]`)?.remove();if(!state.favorites.length)$('#favorite-content').innerHTML=emptyFavorites();const focus=$('#favorite-content button')||$('#app h1');focus?.focus({preventScroll:true})}}
function activateTab(b){document.querySelectorAll('[role="tab"]').forEach(t=>{const active=t===b;t.tabIndex=active?0:-1;t.setAttribute('aria-selected',String(active))});playing=false;$('.tabs').setAttribute('data-active',b.dataset.tab);const panel=$('#place-panel');panel.innerHTML=tabPanel(b.dataset.place,b.dataset.tab);$('.detail-actions').innerHTML=detailActions(b.dataset.place,b.dataset.tab);panel.setAttribute('aria-labelledby',b.id);vputHistory.replaceState(history.state,'',`#place/${b.dataset.place}/${b.dataset.tab}`);lastHash=location.hash;playing=false;}
function announceResults(){const c=$('#result-count');if(c)c.textContent='Найдено мест: '+Object.keys(places).filter(k=>(places[k].title+' '+places[k].sub).toLowerCase().includes(query.trim().toLowerCase())).length;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.save){updateFavorite(b.dataset.save);return}if(b.dataset.vibe){state.vibe=b.dataset.vibe;persist();document.querySelectorAll('[data-vibe]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#home-places').innerHTML=filtered().map(card).join('');$('#category-heading').textContent=headings[state.vibe];return}if(b.dataset.tab){activateTab(b);return}if(b.dataset.pace){state.pace=b.dataset.pace;persist();document.querySelectorAll('[data-pace]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}if(b.dataset.day){selectedDate=b.dataset.day;document.querySelectorAll('[data-day]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const confirm=$('#confirm-place'),added=state.trip.days.find(d=>d.date===selectedDate).stops.some(s=>s.id===confirm.dataset.place);confirm.disabled=added;confirm.textContent=added?'Уже в этом дне':'Добавить '+formatDate(selectedDate);$('#add-hint').textContent='';$('.flow-secondary').dataset.go='trip/'+selectedDate;return}if(b.dataset.move!==undefined){const day=state.trip.days.find(d=>d.date===b.dataset.date),i=Number(b.dataset.move),j=i+Number(b.dataset.direction);if(j>=0&&j<day.stops.length){[day.stops[i],day.stops[j]]=[day.stops[j],day.stops[i]];remember();persist();render();$(`[data-move="${j}"][data-direction="${b.dataset.direction}"]`)?.focus({preventScroll:true})}return}if(b.dataset.delete!==undefined){const day=state.trip.days.find(d=>d.date===b.dataset.date),i=Number(b.dataset.delete);undoStop={date:day.date,index:i,stop:day.stops.splice(i,1)[0]};persist();remember();render();toast('Место убрано из дня.',true);return}switch(b.dataset.action){case'back':back();break;case'confirm-add':{const error=addPlace(b.dataset.place);if(error){$('#add-hint').textContent=error;return}go('trip/'+selectedDate);toast('Место добавлено в план дня.');break}case'play':playing=!playing;b.setAttribute('aria-pressed',String(playing));b.innerHTML=icon(playing?'pause':'play')+`<span>${playing?'Пауза':'Слушать'}</span>`;$('.audio').classList.toggle('playing',playing);break;case'sheet':collapsed=!collapsed;$('.route-sheet').classList.toggle('collapsed',collapsed);$('.sheet-content').inert=collapsed;$('.sheet-content').setAttribute('aria-hidden',String(collapsed));b.setAttribute('aria-expanded',String(!collapsed));b.setAttribute('aria-label',collapsed?'Развернуть описание':'Свернуть описание');break;case'clear-search':query='';$('#search-input').value='';$('#results').innerHTML=results();announceResults();$('#search-input').focus();break;case'undo':if(undoStop){const d=state.trip.days.find(d=>d.date===undoStop.date);if(d)d.stops.splice(undoStop.index,0,undoStop.stop);undoStop=null;persist();render();$('#toast').hidden=true}break;}});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){query=e.target.value;$('#results').innerHTML=results();announceResults()}});
document.addEventListener('change',e=>{if(e.target.dataset.time!==undefined){const d=state.trip.days.find(d=>d.date===e.target.dataset.date),stop=d?.stops[Number(e.target.dataset.time)];if(!stop)return;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(e.target.value)){e.target.value=stop.time;toast('Укажи время начала.');return}stop.time=e.target.value;persist()}});
document.addEventListener('submit',e=>{if(e.target.id!=='trip-form')return;e.preventDefault();const f=e.target,v=new FormData(f),error=createTrip(v.get('name'),v.get('start'),v.get('end'),f.dataset.edit==='true');$('#date-error').textContent=error;if(error){f.elements.end.setAttribute('aria-invalid','true');f.elements.end.focus();return}selectedDate=state.trip.start;go(f.dataset.pending?'add/'+f.dataset.pending:'trip');});
document.addEventListener('focusout',e=>{const f=e.target.closest?.('form');if(f?.id!=='trip-form'||!f.elements.name.value.trim()||!f.elements.start.value||!f.elements.end.value)return;const error=tripError(f.elements.name.value,f.elements.start.value,f.elements.end.value,f.dataset.edit==='true');$('#date-error').textContent=error;f.elements.end.setAttribute('aria-invalid',String(Boolean(error)));});
document.addEventListener('keydown',e=>{if(e.target.getAttribute?.('role')!=='tab')return;const tabs=[...document.querySelectorAll('[role="tab"]')],i=tabs.indexOf(e.target);let j;if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;e.preventDefault();tabs[j].focus();activateTab(tabs[j]);});
window.addEventListener('popstate',()=>render());window.addEventListener('hashchange',()=>{if(lastHash!==location.hash)render()});if(!state.trip){state.trip={name:'Мой Алматы',start:'2026-10-17',end:'2026-10-20',days:['2026-10-17','2026-10-18','2026-10-19','2026-10-20'].map(date=>({date,stops:date==='2026-10-18'?[{id:'medeu',time:'10:00'},{id:'shymbulak',time:'13:00'}]:[]}))};state.favorites=['city'];}vputHistory.replaceState({alma:true,level:0},'',location.hash||'#home');render({restore:false});

</script><script>(function(){function sizePhone(){document.documentElement.style.setProperty('--vput-device-scale',String(Math.max(.2,Math.min(1,(innerWidth-48)/415,(innerHeight-48)/874))));}sizePhone();window.addEventListener('resize',sizePhone);})();</script></body></html>
